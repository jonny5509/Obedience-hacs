name: Build HACS Release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build HACS ZIP
        run: |
          rm -rf build obedience.zip
          mkdir -p build/obedience/custom_components
          cp -r custom_components/obedience build/obedience/custom_components/
          cd build
          zip -r ../obedience.zip obedience

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: obedience.zip
          fail_on_unmatched_files: true
