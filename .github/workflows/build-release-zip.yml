name: Build HACS Release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-release-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify manifest version matches release tag
        run: |
          MANIFEST_VERSION=$(python -c "import json;print(json.load(open('custom_components/obedience/manifest.json'))['version'])")
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Manifest version ($MANIFEST_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Build HACS ZIP
        run: |
          rm -f obedience.zip
          cd custom_components/obedience
          zip -r ../../obedience.zip .

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: obedience.zip
          fail_on_unmatched_files: true