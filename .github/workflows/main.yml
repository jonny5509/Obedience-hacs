name: Build HACS Release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build ZIP
        run: |
          mkdir -p build/chastify/custom_components
          cp -r custom_components/chastify build/chastify/custom_components/
          cd build
          zip -r ../chastify.zip chastify

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: chastify.zip
