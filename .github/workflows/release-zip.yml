name: Build HACS Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to package (for example v2.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and attach HACS ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/obedience/manifest.json"))["version"])')"
          TAG="${RELEASE_TAG#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Release tag v$TAG does not match manifest version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build HACS ZIP
        shell: bash
        run: |
          test -d custom_components/obedience
          cd custom_components/obedience
          zip -r ../../obedience.zip . \
            -x '*/__pycache__/*' '*.pyc' '*/.pytest_cache/*'
          cd ../..
          unzip -l obedience.zip

      - name: Attach ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.event.release.tag_name }}
          files: obedience.zip
          fail_on_unmatched_files: true
